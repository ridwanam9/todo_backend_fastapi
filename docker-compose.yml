services:
  postgres:
    image: postgres:17
    container_name: todo-postgres
    environment:
      POSTGRES_USER: todo_user 
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:





